services:
  suricata:
    image: jasonish/suricata:latest
    container_name: sentinel_suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - ./suricata_logs:/var/log/suricata
    restart: unless-stopped

  valkey:
    image: valkey/valkey:latest
    container_name: sentinel_valkey
    ports:
      - "6379:6379"
    restart: unless-stopped
